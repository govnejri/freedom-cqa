# Чек-лист качества чатов Freedom Broker — начальная конфигурация.
# Источник: docs/checklist.txt (организаторы) + трактовки из docs/core-eval.md §4.
# Примеры (examples) — только из семей сценариев, не входящих в eval/holdout.txt.

id: freedom-cqa
title: Чек-лист качества чатов
version_note: "v1 — чек-лист организаторов + трактовки Т1–Т7"

general_rules: |
  Это набор общих правил оценки. Один и тот же чек-лист применяется к чатам и звонкам на русском, казахском и английском. Критерий отвечает на отдельный вопрос о работе оператора, вес показывает его вклад в итог.
  «Нет» — действие было нужно, но оператор его пропустил или выполнил неправильно. N/A — критерий неприменим по своему условию. Ставь N/A только там, где он разрешён и условие выполнено.
  Общий вопрос о тарифах не требует идентификации. Если требовалась проверка личности перед защищённым действием и она не подтверждена в диалоге, ставь «Нет».
  Ссылайся на конкретную реплику или системное сообщение и коротко поясни, что оно подтверждает. Для пропущенного действия укажи место, где оно ожидалось. Для N/A объясни, какое условие неприменимости выполнено.
  Консультация оценивает, правильно и полно ли решён запрос. Ведение диалога оценивает, насколько понятно и последовательно оператор общался. Ясный ответ на один из двух важных вопросов может получить высокий балл за ведение диалога и частичный за консультацию.
  Предложение услуги в обход компании: оператор предлагает перевести деньги ему лично для инвестирования или просит личный номер клиента, чтобы оказать платную консультацию в частном порядке. Достаточно самого предложения; согласие клиента или перевод денег не требуются.
  Пример обоснования: «Завершение — Нет. После ответа на вопрос оператор закрыл чат без прощания. Основание — последняя реплика оператора и сообщение о закрытии чата».
  Порог первой реакции в 3 минуты, теги и вложения в оценку не входят.

principles: |
  Оцениваешь только работу оператора. Реплики бота (приветствие, согласие на обработку данных, подсказки) оператору не засчитываются и не штрафуются.
  Всё, что клиент написал боту и в ожидании оператора (участок «ожидание оператора»), оператору известно.
  Одно нарушение штрафуется в одном критерии: полнота и правильность ответа — только 04; понятность и порядок реплик — 06; учёт известных данных и уточнения — 02; тон и реакция на недовольство — 05; грубые нарушения — 08. Единственное исключение: раскрытие данных счёта без идентификации — это и 03 «Нет», и 08 «Да».
  Опирайся только на то, что есть в транскрипте. Не додумывай требований к дословным формулировкам.

channel_rules:
  voice call: |
    Это реальный звонок, расшифрованный автоматическим распознаванием речи.
    Ошибки распознавания («федеброкер», искажённые имена и слова, обрывки фраз) — не ошибки оператора; не штрафуй за них грамотность и ясность.
    «[Имя скрыто]», «[Персональные данные скрыты]», «[Данные идентификации скрыты]» — маскирование. «Меня зовут [Имя скрыто]» означает, что оператор представился.
    Участок «УДЕРЖАНИЕ: клиент не слышит» — консультация оператора с коллегой. Эти реплики клиент не слышал: не учитывай их как общение с клиентом и как ответ клиенту.
    Идентификация в звонке проходит голосом (ФИО, адрес, ИИН, SMS-код) без системного сообщения. Признак успеха — подтверждение оператора («всё верно», «идентификация пройдена»).
    Если клиент положил трубку раньше, чем оператор успел попрощаться, завершение оценивай как оборванное.

scoring:
  max_total: 100
  decimals: 2
  rounding: half_up

sections:
  - {id: start, title: Начало и понимание запроса}
  - {id: security, title: Безопасность и решение}
  - {id: conduct, title: Ведение и завершение диалога}
  - {id: gross, title: Грубые нарушения}

criteria:
  - id: "01"
    title: Установление контакта
    section: start
    type: yes_no
    na_allowed: false
    weight: 10
    definition: "Да — оператор поздоровался на языке клиента и представился в первом ответе."
    check_steps:
      - "Найди первую реплику оператора (не бота)."
      - "Проверь, есть ли в ней приветствие на языке клиента и имя оператора."
    interpretations:
      - "Приветствие бота не засчитывается оператору."
      - "Фамильярное «Привет»/«Сәлем» без имени — «Нет»."
      - "В звонках «меня зовут [Имя скрыто]» или имя, искажённое распознаванием, — оператор представился."
    examples:
      - {verdict: "Нет", fragment: "ОПЕРАТОР: Привет, где именно ищете?", why: "фамильярное приветствие, оператор не назвал имя"}
      - {verdict: "Да", fragment: "ОПЕРАТОР: Здравствуйте! Меня зовут Алина. В веб-версии откройте вкладку «Кабинет»…", why: "приветствие и имя в первом ответе"}
    evidence_roles: [operator]

  - id: "02"
    title: Выявление потребности
    section: start
    type: yes_no
    na_allowed: true
    weight: 15
    definition: "Да — оператор учёл известные детали и уточнил недостающее до ответа. N/A — данных для ответа хватало с самого начала."
    na_condition: "Данных для ответа хватало с самого начала, и оператор ответил, ничего не переспрашивая."
    check_steps:
      - "Выпиши, что клиент уже сообщил боту и в ожидании оператора."
      - "Найди реплики, где оператор переспрашивает уже сообщённое, отвечает наугад без нужного уточнения или отвечает не на тот запрос, который задал клиент."
      - "Если таких нет: уточнял ли оператор недостающее до ответа (Да) или данных и так хватало (N/A)."
    interpretations:
      - "Т2: данных хватало, оператор сразу ответил верно — N/A."
      - "Т2б: оператор переспросил то, что клиент уже сообщил боту или в ожидании, — «Нет»."
      - "Ответ наугад, когда без уточнения ответить нельзя, — «Нет»."
      - "Подмена потребности (клиент спрашивает одно, оператор выясняет и отвечает про другое) — «Нет»."
      - "Пропущенный второй вопрос клиента — это неполнота ответа (04), а не провал 02."
      - "Клиент ушёл до формулировки запроса, а оператор спросил, чем помочь, — «Да»."
    examples:
      - {verdict: "Нет", fragment: "КЛИЕНТ (боту): На сайте Freedom Finance Global… / ОПЕРАТОР: Привет, где именно ищете? / КЛИЕНТ: Я уже писал…", why: "переспросил сказанное боту"}
      - {verdict: "Да", fragment: "ОПЕРАТОР: …Как называется скачанный документ? / КЛИЕНТ: Брокерский отчёт…", why: "уточнил недостающее до ответа"}
      - {verdict: "N/A", fragment: "КЛИЕНТ: Логин занят, хотя старый счёт закрыт / ОПЕРАТОР: …использованный логин остаётся в системе…", why: "данных хватало, ответ сразу"}
    evidence_roles: [operator, client]

  - id: "03"
    title: Идентификация
    section: security
    type: yes_no
    na_allowed: true
    weight: 20
    definition: "Да — проверка личности подтверждена до раскрытия данных или защищённого действия. N/A — запрос не требовал идентификации."
    na_condition: "Данные конкретного счёта не раскрывались и защищённых действий по счёту не выполнялось."
    check_steps:
      - "Найди первую реплику оператора, где раскрыты данные конкретного счёта клиента или выполнено/начато действие по счёту."
      - "Найди подтверждение личности: системное сообщение в чате или голосовое подтверждение в звонке."
      - "Сравни порядок: подтверждение раньше раскрытия — Да; раскрытие без подтверждения или раньше него — Нет; раскрытия не было — N/A."
    interpretations:
      - "Т3б: счёт обсуждали, но данные не раскрыты (оператор предупредил о проверке, клиент отказался) — N/A."
      - "Т6: в звонке частично не совпали данные, но проверка пройдена по SMS-коду и оператор подтвердил — «Да»."
    examples:
      - {verdict: "Да", fragment: "ОПЕРАТОР: Сначала нужно подтвердить личность… / СИСТЕМА: Личность клиента подтверждена. / ОПЕРАТОР: Я передал вопрос по зачислению…", why: "подтверждение до действия по счёту"}
      - {verdict: "N/A", fragment: "ОПЕРАТОР: Если нужно проверить именно ваш счёт, понадобится идентификация. / КЛИЕНТ: Давайте пока без неё.", why: "данные счёта не раскрывались"}
    evidence_roles: [operator, system, client]
    cross_check: true

  - id: "04"
    title: Корректная и полная консультация
    section: security
    type: scale
    na_allowed: true
    weight: 20
    scale:
      - {value: 20, text: "Все существенные вопросы закрыты или дан корректный следующий шаг."}
      - {value: 15, text: "Основной вопрос решён, пропущена второстепенная деталь."}
      - {value: 10, text: "Часть запроса закрыта, существенный вопрос остался открытым."}
      - {value: 5, text: "Есть общая подсказка, но клиенту всё ещё непонятно, как действовать."}
      - {value: 0, text: "Ответа по существу нет или ключевая рекомендация ошибочна."}
    definition: "Оцени ответ или следующий шаг по шкале."
    na_condition: "Чат закончился до того, как клиент сформулировал запрос."
    check_steps:
      - "Выпиши все вопросы клиента, включая заданные боту и в ожидании оператора."
      - "Для каждого найди ответ оператора вне участка удержания и оцени, закрыт ли вопрос и верен ли ответ."
      - "Выбери ступень сверху вниз по шкале."
    interpretations:
      - "Оценивается итоговый ответ. Т4: если первый совет был ошибочным, но оператор исправился и итог верный — 20; сбой учитывается в 06."
      - "Сказанное коллеге на удержании — не ответ клиенту."
      - "Вопрос, проигнорированный оператором дважды, — существенный."
      - "Уточняющий вопрос клиента закрыт, если оператор ответил по сути — даже кратко или косвенно («настройка относится только к текущему приказу», «для регистрации выберите другой логин»). Не требуй развёрнутого объяснения там, где клиенту хватило ответа."
    examples:
      - {verdict: "10", fragment: "КЛИЕНТ: Где оно в приложении и когда можно опять пробовать вывод? / ОПЕРАТОР: …Изменение сведений. / КЛИЕНТ: После отправки сразу заново подавать? / ОПЕРАТОР: Путь к обновлению я указал. Хорошего дня!", why: "путь дан, вопрос «когда выводить» остался открытым"}
      - {verdict: "0", fragment: "ОПЕРАТОР: Сейчас точно биржа отменяет ваш приказ, ничего не сделать. / КЛИЕНТ: Почему точно? / ОПЕРАТОР: Тогда не знаю.", why: "ответа по существу нет"}
    evidence_roles: [operator, client]

  - id: "05"
    title: Эмпатия и клиентоориентированность
    section: conduct
    type: yes_no
    na_allowed: false
    weight: 15
    definition: "Да — оператор вежлив и, если клиент выразил недовольство или описал неудобство, отреагировал на конкретную проблему."
    check_steps:
      - "Найди реплики оператора с грубостью, пренебрежением или отпиской."
      - "Найди реплики, где клиент выражает недовольство или беспокойство, и проверь, отреагировал ли оператор на эту проблему (признал, извинился или решил её)."
    interpretations:
      - "Отреагировать на проблему можно и без эмпатической фразы — решив её по существу."
      - "Отписка или игнорирование возражения клиента («Подтверждение пока не нужно», «Всё есть в приложении») — «Нет»."
      - "Уход от второго вопроса без грубости учитывается в 04 и 06, а не в 05."
      - "Неформальное приветствие («Привет», «Сәлем») и обращение на «ты» без грубости — не нарушение 05: это учитывается в 01."
      - "Неполный или уклончивый ответ, сказанный ровным тоном, — не нарушение 05. «Нет» в 05 — при грубости, насмешке, пренебрежительном тоне или если оператор отмахнулся от прямо выраженного недовольства клиента."
      - "Предложение услуги в обход компании оценивается в 08; в 05 его повторно не штрафуй, если тон вежливый."
    examples:
      - {verdict: "Нет", fragment: "ОПЕРАТОР: Вы вообще читать умеете? Бот всё написал.", why: "грубость"}
      - {verdict: "Да", fragment: "ОПЕРАТОР: Понимаю, что пропавшая строка в портфеле беспокоит. Уточните…", why: "отреагировал на беспокойство клиента"}
    evidence_roles: [operator, client]

  - id: "06"
    title: Управление диалогом, скорость и грамотность
    section: conduct
    type: scale
    na_allowed: false
    weight: 15
    scale:
      - {value: 10, text: "Ответы ясные и связные. Если было явное ожидание, оператор предупредил."}
      - {value: 7, text: "Один заметный сбой, но клиент может понять ответ и продолжить."}
      - {value: 4, text: "Клиенту приходится переспрашивать из-за формулировок или порядка ответов."}
      - {value: 0, text: "Из-за бессвязных или противоречивых реплик ход диалога непонятен."}
    definition: "Оцени ясность, порядок ответов и предупреждение об ожидании по шкале."
    check_steps:
      - "Найди противоречащие друг другу или бессвязные реплики оператора."
      - "Найди места, где клиенту пришлось переспросить или повторно пояснить из-за формулировки или порядка ответа оператора."
      - "Для пауз из фактов проверь, предупредил ли оператор об ожидании."
      - "Выбери ступень сверху вниз по шкале."
    interpretations:
      - "Т7: клиенту пришлось переспросить — 4; один заметный сбой без переспроса — 7."
      - "Лишний или повторный вопрос о том, что клиент уже сообщил, учитывается в 02, а не в 06. На 06 он влияет, только если из-за него клиент запутался."
      - "Пауза во время объявленной процедуры (идентификация, проверка, оформление обращения) считается предупреждённой."
      - "Неэтичное, но ясное сообщение оценивается в 08, а не здесь."
    examples:
      - {verdict: "4", fragment: "ОПЕРАТОР: Там же где перевод, не в отчете, сверху вниз в меню. / КЛИЕНТ: В каком меню? Я уже в приложении.", why: "невнятная формулировка, клиент переспросил"}
      - {verdict: "10", fragment: "ОПЕРАТОР: Сейчас проверю путь. / (пауза 2 минуты) / ОПЕРАТОР: Спасибо за ожидание…", why: "ожидание предупреждено, ответы ясные"}
    evidence_roles: [operator, client]

  - id: "07"
    title: Завершение
    section: conduct
    type: yes_no
    na_allowed: true
    weight: 5
    definition: "Да — оператор подвёл итог или предложил дальнейшую помощь и попрощался. N/A — чат оборвался до возможности его завершить."
    na_condition: "Диалог оборвался (обрыв связи, клиент ушёл или положил трубку) раньше, чем оператор мог его завершить."
    check_steps:
      - "Посмотри, как закончился диалог: событие завершения из фактов и последние реплики."
      - "Если диалог оборвался раньше, чем оператор мог ответить, — N/A."
      - "Иначе проверь прощание и итог или предложение помощи в последних репликах оператора."
    interpretations:
      - "Т1: если клиент подтвердил, что вопрос решён, вежливое прощание оператора («Пожалуйста. Хорошего дня!») засчитывается — «Да»."
      - "Т1б: прощание, обрывающее незакрытый вопрос клиента, — «Нет»."
      - "Оператор закрыл чат без прощания — «Нет». Нет финальной реплики оператора без события обрыва — «Нет»."
    examples:
      - {verdict: "Нет", fragment: "ОПЕРАТОР: Тогда не знаю. / СИСТЕМА: Оператор закрыл чат.", why: "закрыл чат без прощания"}
      - {verdict: "Да", fragment: "КЛИЕНТ: Нашла, спасибо. / ОПЕРАТОР: Пожалуйста. Хорошего вечера!", why: "вопрос решён, вежливое прощание"}
      - {verdict: "Да", fragment: "ОПЕРАТОР: Хорошо, начните со сверки дат. Если вопрос останется, напишите нам. До свидания!", why: "итог, предложение помощи и прощание"}
    evidence_roles: [operator, system, client]

  - id: "08"
    title: Грубые ошибки
    section: gross
    type: flag
    na_allowed: false
    weight: 0
    definition: "Да — выявлено оскорбление клиента, предложение платной услуги в обход компании или раскрытие конфиденциальной информации. Нет — ни одно из трёх не выявлено."
    flag_categories: [оскорбление, обход компании, раскрытие данных]
    check_steps:
      - "Ищи каждое из трёх нарушений отдельно: оскорбление клиента; предложение перевести деньги лично или дать личный номер для платной консультации; раскрытие конфиденциальной информации."
      - "Достаточно одной реплики оператора."
    interpretations:
      - "Т3: оператор сообщил данные конкретного счёта (например, ограничение на вывод) до подтверждения личности — раскрытие конфиденциальной информации, «Да»."
      - "Ставящая под сомнение способности клиента реплика («Вы вообще читать умеете?») — оскорбление."
    examples:
      - {verdict: "Да", fragment: "ОПЕРАТОР: Можете дать личный номер? Вечером созвонюсь с вами и за плату объясню, какие бумаги взять.", why: "платная услуга в обход компании"}
    evidence_roles: [operator]
    cross_check: true

signals:
  topics: [тарифы и комиссии, вход и доступ, регистрация, пополнение, вывод средств, отчёты и налоги, поиск бумаг и торговля, облигации, персональные данные, прочее]
